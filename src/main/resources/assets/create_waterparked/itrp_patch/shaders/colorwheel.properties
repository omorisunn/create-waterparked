

blend.clrwl_gbuffers = off
blend.clrwl_gbuffers_additive = off
blend.clrwl_gbuffers_lightning = off
blend.clrwl_gbuffers_glint = off
blend.clrwl_gbuffers_translucent = off
# Waterparked: clrwl_gbuffers_translucent must mirror vanilla gbuffers_water's
# per-buffer blending. Water_FS writes albedo.a = 0, and with this blend
# colortex0 keeps the opaque terrain/entity albedo under the water. Without it
# the thrown stream overwrites colortex0 with the grey water_still texture,
# composite25 (Soild_FS) shades that as the solid albedo, and everything behind
# the stream renders pure white.
blend.clrwl_gbuffers_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.clrwl_gbuffers_translucent.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA SRC_ALPHA ONE_MINUS_SRC_ALPHA
blend.clrwl_gbuffers_damagedblock = off

oit = false
