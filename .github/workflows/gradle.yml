name: Mod Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      ccs_version:
        description: "Create: Coasters Simulated version"
        required: false
        default: "0.1.4"

env:
  CCS_VERSION: 0.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run as Admin
      run: chmod +x gradlew

    - name: "resolve and download Create: Coasters Simulated jar"
      env:
        CCS_VERSION: ${{ env.CCS_VERSION }}
      run: |
        mkdir -p libs
        url=$(curl -fsSL -H "User-Agent: create-waterparked-ci/0.1" \
          "https://api.modrinth.com/v2/project/W1ZUfWdr/version?game_versions=%5B%221.21.1%22%5D&loaders=%5B%22neoforge%22%5D" \
          | jq -r '.[] | select(.version_number == env.CCS_VERSION) | .files[] | select(.primary == true) | .url' | head -n 1)
        if [ -z "$url" ]; then
          echo "::error::CCS version $CCS_VERSION not found on Modrinth"
          exit 1
        fi
        curl -fsSL "$url" -o "libs/simulatedcoasters-$CCS_VERSION.jar"
        ls -la libs

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build mod
      run: ./gradlew build

    - name: Upload mod jar
      uses: actions/upload-artifact@v4
      with:
        name: create-waterparked
        path: build/libs/*.jar

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
